<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Negara · Jejak Kopi</title>
<meta name="theme-color" content="#A2664B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="top" id="appTop"></header>
  <main class="view" id="view"></main>
</div>
<nav class="tabs" id="appTabs"></nav>

<script src="assets/seed.js"></script>
<script src="assets/app.js"></script>
<script>
shell({ kembali: "index.html", kembaliTeks: "semua negara" });

const NEGARA = qs("n");
let filterProses = "";

function render(){
  const v = $("#view");
  const semua = Store.kopi().filter(k => (k.negara || "Tanpa negara") === NEGARA);
  document.title = NEGARA + " · Jejak Kopi";

  if(!semua.length){
    v.innerHTML = `<h1 class="page-title">${esc(NEGARA)}</h1>
      <div class="empty"><p>Belum ada kopi dari negara ini di arsipmu.</p>
      <a class="btn ghost" href="catat.html">Catat satu</a></div>`;
    return;
  }

  const prosesSet = Array.from(new Set(semua.map(k => k.process).filter(Boolean))).sort();
  const list = filterProses ? semua.filter(k => k.process === filterProses) : semua;

  const perDaerah = new Map();
  list.forEach(k => {
    const d = k.origin || "Daerah tidak dicatat";
    if(!perDaerah.has(d)) perDaerah.set(d, []);
    perDaerah.get(d).push(k);
  });
  const daerah = Array.from(perDaerah.entries())
    .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

  const varietas = new Set();
  semua.forEach(k => (k.variety || []).forEach(x => varietas.add(x)));

  v.innerHTML = `
    <div data-w="${warnaNegara(NEGARA)}"
         style="display:flex;align-items:center;gap:13px;margin-bottom:16px">
      <span class="flag" style="width:54px;height:54px;font-size:27px;border-radius:15px"
            aria-hidden="true">${bendera(NEGARA)}</span>
      <span>
        <h1 class="page-title" style="margin:0">${esc(NEGARA)}</h1>
        <div class="page-sub">${semua.length} kopi · ${perDaerah.size} daerah · ${varietas.size} varietas</div>
      </span>
    </div>

    ${prosesSet.length > 1 ? `<div class="chips" data-w="${warnaNegara(NEGARA)}">
      <button class="chip" data-p="" aria-pressed="${!filterProses}">Semua proses</button>
      ${prosesSet.map(p => `<button class="chip" data-p="${esc(p)}"
        aria-pressed="${filterProses === p}">${esc(p)}</button>`).join("")}
    </div>` : ""}

    ${daerah.map(([nama, arr]) => `
      <div class="sec-head" style="margin-top:22px">
        <h2 class="sec-title">${esc(nama)}</h2>
        <span class="sec-act" style="color:var(--faint)">${arr.length}</span>
      </div>
      ${arr.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
          .map(kartuTiket).join("")}
    `).join("")}`;

  $$("[data-p]").forEach(b => b.addEventListener("click", () => {
    filterProses = b.dataset.p; render(); window.scrollTo(0, 0);
  }));
}

document.addEventListener("data-siap", render);
document.addEventListener("data-baru", render);
Store.init();
</script>
</body>
</html>
