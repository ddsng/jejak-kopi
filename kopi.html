<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kopi · Jejak Kopi</title>
<meta name="theme-color" content="#A2664B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="top" id="appTop"></header>
  <main class="view" id="view"></main>
</div>
<nav class="tabs" id="appTabs"></nav>

<script src="assets/seed.js"></script>
<script src="assets/app.js"></script>
<script>
const ID = qs("id");

function render(){
  const v = $("#view");
  const k = Store.cari(ID);
  if(!k){
    shell({ kembali:"index.html", kembaliTeks:"beranda" });
    v.innerHTML = `<div class="empty"><h3>Kopi tidak ditemukan</h3>
      <p>Catatan ini mungkin sudah dihapus, atau tautannya salah.</p>
      <a class="btn ghost" href="index.html">Kembali ke beranda</a></div>`;
    return;
  }
  shell({ kembali: k.negara ? "negara.html?n=" + encodeURIComponent(k.negara) : "index.html",
          kembaliTeks: k.negara || "beranda" });
  document.title = (k.nama || "Kopi") + " · Jejak Kopi";

  const w = warnaNegara(k.negara);
  const hari = hariRoast(k.roastDate);
  const segar = hari === null ? null
    : hari <= 21 ? ["good", "puncak rasa"]
    : hari <= 45 ? ["warn", "masih oke"]
    : ["crit", "sudah lewat"];

  const telusur = (f, val) =>
    "telusur.html?f=" + f + "&v=" + encodeURIComponent(val);

  const sel = (label, val, href, cls) => {
    if(!val) return `<span><span class="k">${label}</span>
      <span class="v kosong">belum diisi</span></span>`;
    const isi = href ? `<a href="${href}">${esc(val)}</a>` : esc(val);
    return `<span><span class="k">${label}</span>
      <span class="v ${cls || ""}">${isi}</span></span>`;
  };

  const notes = k.notes || [];
  const seduhan = (k.seduhan || []).slice()
    .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));

  v.innerHTML = `
  <article class="tk" data-w="${w}">
    <div class="hd">
      <span class="ctry">${bendera(k.negara)} ${esc(k.negara || "Tanpa negara")}</span>
      <h1 class="nm">${esc(k.nama || "Tanpa nama")}</h1>
      <div class="org">${k.origin
        ? `<a href="negara.html?n=${encodeURIComponent(k.negara || "")}">${esc(k.origin)}</a>`
        : "origin belum diisi"}</div>
    </div>
    <div class="bd">
      <div class="gr">
        ${sel("Farm", k.farm)}
        ${sel("Producer", k.producer)}
        ${sel("Variety", (k.variety || []).join(", "),
              (k.variety || [])[0] ? telusur("variety", k.variety[0]) : null)}
        ${sel("Process", k.process, k.process ? telusur("process", k.process) : null)}
        ${sel("Altitude", k.altitude, null, "alt")}
        ${segar ? `<span><span class="k">Umur sangrai</span>
          <span class="v" style="color:var(--${segar[0]})">${hari} hari · ${segar[1]}</span></span>`
          : sel("Umur sangrai", null)}
      </div>
      <div class="rasa">
        <span class="k">Tasting notes</span>
        ${notes.length
          ? `<div class="notes">${notes.map(n =>
              `<a class="note" href="${telusur("notes", n)}"><em aria-hidden="true">${rasaEmoji(n)}</em>${esc(n)}</a>`).join("")}</div>`
          : `<p class="muted" style="margin:6px 0 0">Belum ada catatan rasa.</p>`}
      </div>
    </div>
    <div class="perf"></div>
    <div class="stub">
      <div><span class="k">Roastery</span>
        <span class="who">${k.roaster
          ? `<a href="${telusur("roaster", k.roaster)}">${esc(k.roaster)}</a>` : "—"}</span></div>
      <div class="when"><span class="k">Roasted</span>
        <span class="who">${k.roastDate ? esc(fmtDate(k.roastDate)) : "—"}</span></div>
    </div>
  </article>

  ${k.catatan ? `<div class="sec-head" style="margin-top:26px">
      <h2 class="sec-title">Catatan</h2></div>
    <p class="muted" style="margin:0;white-space:pre-wrap">${esc(k.catatan)}</p>` : ""}

  <div class="sec-head" style="margin-top:26px"><h2 class="sec-title">Riwayat seduhan</h2>
    <button class="sec-act" id="tambahSeduh">+ tambah</button></div>
  <div id="seduhList" data-w="${w}">${seduhan.length ? seduhan.map(barisSeduh).join("")
    : `<p class="muted" style="margin:0">Belum ada seduhan tercatat.</p>`}</div>

  <div class="hr"></div>
  <div class="btn-row" style="margin-top:0" data-w="${w}">
    <a class="btn ghost" href="catat.html?id=${encodeURIComponent(k.id)}"
       style="flex:1">Ubah catatan</a>
    <button class="btn danger" id="hapus">Hapus</button>
  </div>
  <div style="height:10px"></div>`;

  $("#tambahSeduh").addEventListener("click", () => formSeduh());
  $("#hapus").addEventListener("click", async () => {
    if(!confirm("Hapus catatan kopi ini?")) return;
    await Store.hapus(k.id);
    location.href = "index.html";
  });
}

function barisSeduh(s){
  const bits = [fmtDate(s.tanggal), s.dosis ? s.dosis + " g" : null,
    s.air ? s.air + " ml" : null, s.suhu ? s.suhu + "°C" : null, s.waktu].filter(Boolean);
  return `<div class="seduh">
    <span class="seduh-m">${esc((s.metode || "?").split(" ")[0])}</span>
    <span class="seduh-b">
      <span class="seduh-d">${esc(bits.join(" · "))}</span>
      ${s.catatan ? `<span class="seduh-n">${esc(s.catatan)}</span>` : ""}
    </span>
  </div>`;
}

/* --- formulir seduhan, muncul langsung di halaman --- */
function formSeduh(){
  if($("#formSeduh")) return;
  const box = $("#seduhList");
  const el = document.createElement("div");
  el.id = "formSeduh";
  el.style.cssText = "border:1px solid var(--rule);border-radius:var(--r-m);" +
    "padding:13px 14px;margin-bottom:14px;background:#fff";
  el.innerHTML = `
    <div class="grid2">
      <div class="f"><label for="sTgl">Tanggal</label>
        <input type="date" id="sTgl" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="f"><label for="sMet">Metode</label>
        <input type="text" id="sMet" list="dl-metode" placeholder="V60"></div>
    </div>
    <div class="grid2">
      <div class="f"><label for="sDos">Dosis (g)</label>
        <input type="number" id="sDos" step="0.1" inputmode="decimal"></div>
      <div class="f"><label for="sAir">Air (ml)</label>
        <input type="number" id="sAir" inputmode="numeric"></div>
    </div>
    <div class="grid2">
      <div class="f"><label for="sSuhu">Suhu (°C)</label>
        <input type="number" id="sSuhu" inputmode="numeric"></div>
      <div class="f"><label for="sWkt">Waktu</label>
        <input type="text" id="sWkt" placeholder="2:45"></div>
    </div>
    <div class="f" style="margin-bottom:0"><label for="sCat">Catatan</label>
      <textarea id="sCat" placeholder="apa yang berubah dari seduhan sebelumnya?"></textarea></div>
    <div class="btn-row">
      <button class="btn" id="sSimpan" style="flex:1">Simpan seduhan</button>
      <button class="btn ghost" id="sBatal">Batal</button>
    </div>
    <datalist id="dl-metode"></datalist>`;
  box.prepend(el);
  datalist("dl-metode", METODE_UMUM);
  $("#sBatal").addEventListener("click", () => el.remove());
  $("#sSimpan").addEventListener("click", async () => {
    const g = i => { const e = document.getElementById(i); return e ? e.value.trim() : ""; };
    const s = { id: uid(), tanggal: g("sTgl"), metode: g("sMet"),
      dosis: parseFloat(g("sDos")) || null, air: parseFloat(g("sAir")) || null,
      suhu: parseFloat(g("sSuhu")) || null, waktu: g("sWkt"), catatan: g("sCat") };
    if(!s.metode && !s.catatan){ toast("Isi metode atau catatannya dulu."); return; }
    const rec = Object.assign({}, Store.cari(ID));
    rec.seduhan = (rec.seduhan || []).concat([s]);
    await Store.simpan(rec);
    render();
    toast(Store.bisaTulis() ? "Seduhan tercatat."
      : "Seduhan tersimpan di perangkat ini (belum terhubung GitHub).");
  });
}

document.addEventListener("data-siap", render);
document.addEventListener("data-baru", () => { if(!$("#formSeduh")) render(); });
Store.init();
</script>
</body>
</html>
