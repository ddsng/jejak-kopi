<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telusur · Jejak Kopi</title>
<meta name="theme-color" content="#A2664B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="top" id="appTop"></header>
  <main class="view" id="view"></main>
</div>
<nav class="tabs" id="appTabs"></nav>

<script src="assets/konfigurasi.js"></script>
<script src="assets/seed.js"></script>
<script src="assets/app.js"></script>
<script>
shell({});

const FACET = [
  ["variety", "Varietas"], ["process", "Proses"],
  ["notes", "Rasa"], ["roaster", "Roaster"], ["origin", "Daerah"]
];
let tab = qs("f") || "variety";
let pilih = qs("v") || "";
let cari = "";

function nilai(k, key){
  if(key === "variety") return k.variety || [];
  if(key === "notes") return k.notes || [];
  return k[key] ? [k[key]] : [];
}

function render(){
  const v = $("#view");
  const semua = Store.kopi();

  const chips = FACET.map(([k, l]) =>
    `<button class="chip" data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join("");

  const m = new Map();
  semua.forEach(k => nilai(k, tab).forEach(x => m.set(x, (m.get(x) || 0) + 1)));
  let rows = Array.from(m.entries()).map(([x, n]) => ({ x, n }))
    .sort((a, b) => b.n - a.n || a.x.localeCompare(b.x));
  if(cari) rows = rows.filter(r => r.x.toLowerCase().includes(cari.toLowerCase()));
  const max = Math.max(1, ...rows.map(r => r.n));

  const hasil = pilih ? semua.filter(k => nilai(k, tab).includes(pilih)) : [];
  const label = FACET.find(f => f[0] === tab)[1].toLowerCase();

  v.innerHTML = `
    <div class="chips">${chips}</div>

    ${pilih ? `
      <div class="sec-head">
        <h2 class="sec-title">${esc(pilih)} — ${hasil.length} kopi</h2>
        <button class="sec-act" id="reset">✕ hapus saringan</button>
      </div>
      ${hasil.length ? hasil.map(barisKopi).join("")
        : `<p class="muted">Tidak ada yang cocok.</p>`}
      <div class="hr"></div>` : ""}

    <div class="f"><input type="text" id="cari" placeholder="Cari di daftar…"
      value="${esc(cari)}" autocomplete="off"></div>
    <div class="sec-head"><h2 class="sec-title">${rows.length} ${label} tercatat</h2></div>
    ${rows.length ? rows.map(r => `
      <button class="facet" data-pilih="${esc(r.x)}">
        <span class="bar" style="width:${(r.n / max * 56 + 6).toFixed(0)}px"></span>
        <span class="facet-n">${tab === "notes" ? rasaEmoji(r.x) + " " : ""}${esc(r.x)}</span>
        <span class="facet-c">${r.n}</span>
      </button>`).join("")
      : `<div class="empty"><p>Belum ada data di kategori ini.</p></div>`}`;

  $$("[data-tab]").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.tab; pilih = ""; cari = ""; render(); window.scrollTo(0, 0); }));
  $$("[data-pilih]").forEach(b => b.addEventListener("click", () => {
    pilih = b.dataset.pilih; render(); window.scrollTo(0, 0); }));
  const r = $("#reset"); if(r) r.addEventListener("click", () => { pilih = ""; render(); });
  const c = $("#cari");
  if(c) c.addEventListener("input", () => {
    const pos = c.selectionStart; cari = c.value; render();
    const n = $("#cari"); if(n){ n.focus(); n.setSelectionRange(pos, pos); }
  });
}

document.addEventListener("data-siap", render);
document.addEventListener("data-baru", render);
Store.init();
</script>
</body>
</html>
